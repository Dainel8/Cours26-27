<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Google</title>
</head>
<body>
    <header>
        <nav>
            <a href="https://about.google/">À propos</a>
            <a href="https://store.google.com/">Google Store</a>
            <div class="top-right">
                <div id="links">
                    <a href="https://mail.google.com/">Gmail</a>
                    <a href="https://www.google.com/imghp">Images</a>
                </div>
                <div id="tools">
                    <a><img src="assets/images/outils.png" alt="Outils"></a>
                </div>
                <div id="profile">
                    <img src="assets/images/profile.jpg" alt="Profil">
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="logo">
            <img src="assets/images/google.svg" alt="logo google">
        </div>
        <div class="core">
            <div class="search-bar">
                <input type="text" placeholder="">
            </div>
            <div class="buttons">
                <button>Recherche Google</button>
                <button>J'ai de la chance</button>
            </div>
        </div>
        <div class="fill">
        </div>
    </main>

    <footer>
        <div class="language">
            France
        </div>

        <div class="lower-foot">
            <div id="climat">
                <a>
                    <img src="assets/images/feuille.png" alt="image feuille">
                    <span>Notre troisième décennie d'action pour le climat</span>
                </a>
            </div>

            <div>
                <a>Publicité</a>
                <a>Entreprise</a>
                <a>Comment fonctionne la recherche google ?</a>
            </div>

            <div>
                <a>Signaler un contenu inapproprié</a>
                <a>Info consomateurs</a>
                <a>Confidentialité</a>
                <a>Conditions</a>
                <a>Paramètres</a>
            </div>
        </div>
    </footer>
</body>
</html>
